# Career Intelligence with Docker: the app (API + web UI on one port) and PostgreSQL 16.
#
#   ./install.sh                 creates .env with a random database password and starts it
#   docker compose up -d --build start / update     docker compose down   stop (data is kept)
#
# Open http://127.0.0.1:8010 (APP_PORT in .env). It listens on this computer only; to open it to
# your network set APP_BIND=0.0.0.0 in .env — and set APP_PASSWORD too.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (./install.sh does it)}
      POSTGRES_DB: career_intelligence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_intelligence"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: career-intelligence:latest
    restart: unless-stopped
    # Your settings (APP_PASSWORD, AI_PROVIDER, …). The lines below always win over it.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://career:${POSTGRES_PASSWORD}@db:5432/career_intelligence
      STATIC_DIR: /app/ui
      STORAGE_PATH: /data/storage
      BACKUP_PATH: /data/backups
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8010}:8010"
    volumes:
      - appdata:/data   # uploaded CVs and automatic backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
